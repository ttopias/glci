name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
      - name: Docker
        run: |
          docker info
          test -S /var/run/docker.sock
          echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
      - name: Pre-pull test images
        run: |
          docker pull alpine:3.24
          docker pull nginx:alpine
          docker pull python:3.14-alpine
          docker pull docker:29
          docker run --rm alpine:3.24 echo docker-run-ok
      - name: Test
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        shell: bash
        run: |
          set -o pipefail
          echo "PATH=$PATH"
          command -v docker
          if ! go test ./... -count=1 -timeout 15m -v | tee test-output.txt; then
            echo "go test failed" >&2
            grep -E 'FAIL:|FAIL[[:space:]]|docker is required|--- SKIP: TestDocker|executable file' test-output.txt | head -n 50 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
          # go test -v prints: --- SKIP: TestName (0.00s)
          if grep -E '^--- SKIP: TestDocker' test-output.txt; then
            echo "docker e2e tests must not skip on GitHub Actions" >&2
            echo "::error::docker e2e tests skipped"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs
          path: test-output.txt
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
